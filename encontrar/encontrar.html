<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./encontrar.css" />
  </head>
  <body>
    <h1>Animal pérdido</h1>
    
    <div class="contenedorInformacion">
      <div class="personaje">
        <div class="infoTexto">
          <br />
          <p id="Info">
            ¡El puma está escondido en uno de estos tres arbustos, ayúdanos a
            encontrarlo para cuidarlo!
          </p>
        </div>
        <img src="./multimedia/ninio.png" id="ninio" />
      </div>
    </div>
    <div class="abajo">
      <button src="./multimedia/Santii.mp3" title="escuchar">
        <img src="../imgs/audio.png" alt="audio" />
      </button>
      <button id="Volver">Volver al mapa</button>
    </div>

    <div class="juego">
      <div class="escondites">
        <div class="escondite" id="escondite1">
          <img src="./multimedia/arbsusto_niandu.png" id="esconditeImg1" />
        </div>
        <div class="escondite" id="escondite2">
          <img src="./multimedia/arbsusto_niandu.png" id="esconditeImg2" />
        </div>
        <div class="escondite" id="escondite3">
          <img src="./multimedia/arbsusto_niandu.png" id="esconditeImg3" />
        </div>
      </div>
    </div>
    <div class="mensaje">
      <div id="mensajeGanador">
        <h2>¡Felicitaciones!</h2>
        <p>¡Encontraste al puma perdido!</p>
        <button id="btnContinuar">Continuar</button>
      </div>
    </div>

    <script src="./encontrar.js"></script>
  </body>
</html>
