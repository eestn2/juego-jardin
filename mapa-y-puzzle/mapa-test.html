<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regiones sobre ruedas</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chewy&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./estilo-mapa.css" />
  </head>
  <body>
    <div class="barra-superior">
      <div class="monedas-y-exp">
        <img src="../imgs/Icono-moneda.png" id="Icono-moneda" />
        <span class="cantidad-moneda" id="contador-monedas"> 15</span>
      </div>
      <div class="monedas-y-exp">
        <img src="../imgs/Icono-moneda.png" id="Icono-exp" />
        <span class="cantidad-exp" id="contador-exp">0</span>
      </div>
    </div>

    <object id="mapa" type="image/svg+xml" data="ar_corrigido.svg"></object>

    <div id="region-info">
      <strong id="region-title"></strong><br />
      <span id="region-provincias"></span>
    </div>
    <div class="region-datos">
      <button class="cerrar">X</button>
      <p id="texto-datos"></p>
      <div class="botonesarriba">
        <button class="btn-fauna-y-flora">Fauna y Flora</button>
        <button class="btn-paisajes">Paisajes</button>
        <button class="btn-danzas">Danzas</button>
        <button class="btn-recetas">Recetas</button>
        <button class="btn-turismo">Turismo</button>
        <button class="btn-pueblos-originarios">Pueblos Originarios</button>
      </div>
      <button class="btn-jugar">Jugar</button>
    </div>

    <button id="btn-reiniciar">Reiniciar progreso</button>

    <script src="./mapa.js"></script>
  </body>
</html>
